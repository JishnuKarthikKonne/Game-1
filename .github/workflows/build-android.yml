name: Build Android Application

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/build-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Run verification test suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          mkdir -p release/android
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../release/android/PARADOX-debug.apk

      - name: Build Android Release APK (Signed or Unsigned)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing keystore detected. Decoding and compiling signed release APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            export RELEASE_STORE_FILE="release.keystore"
            export RELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../release/android/PARADOX-release.apk
          else
            echo "No keystore secret provided. Compiling unsigned release APK..."
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../release/android/PARADOX-release-unsigned.apk
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PARADOX-Android-APKs
          path: release/android/*.apk
          if-no-files-found: error
